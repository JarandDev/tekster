version: 2

updates:
    -   package-ecosystem: "npm"
        directory: "/"
        schedule:
            interval: "cron"
            cronjob: "0 4 * * *"
        groups:
            all-version-updates:
                patterns:
                    - "*"
            all-security-updates:
                applies-to: security-updates
                patterns:
                    - "*"
        commit-message:
            prefix: "deps"
        assignees:
            - "JarandDev"
    -   package-ecosystem: "github-actions"
        directory: "/"
        schedule:
            interval: "cron"
            cronjob: "0 4 * * *"
        groups:
            all-version-updates:
                patterns:
                    - "*"
            all-security-updates:
                applies-to: security-updates
                patterns:
                    - "*"
        commit-message:
            prefix: "deps"
        assignees:
            - "JarandDev"
